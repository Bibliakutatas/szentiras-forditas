site_name: "A Bibliát Kutatom – Szöveghű Fordítás"
site_description: "Nyers, szövegkritikai Bibliafordítás a héber MT és a görög LXX alapján."
theme:
  name: material
  language: hu
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Sötét mód
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Világos mód
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

